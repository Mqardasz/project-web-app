<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link th:href="@{/css/edit-style.css}" rel="stylesheet" />
    <title th:text="${zadanie.zadanieId != null} ? 'Edycja zadania' : 'Dodawanie zadania'">Edycja zadania</title>
</head>
<body>
    <div class="root" th:with="isDelete=${#strings.equalsIgnoreCase(param.delete,'true')}">
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <form th:action="@{/zadanieEdit}" th:object="${zadanie}" method="POST"
              th:with="akcja=*{zadanieId} ? (${isDelete} ? 'delete' : 'update') : 'create', opis=*{zadanieId} ? (${isDelete} ? 'Usuń' : 'Aktualizuj') : 'Stwórz'" autocomplete="off">

            <h1 th:text="${opis} + ' zadanie'">Edytuj zadanie</h1>

            <div class="err" th:if="${#fields.hasErrors('*')}">
                BŁĘDY:
                <ul>
                    <li th:each="err : ${#fields.errors('*')}" th:text="${err}">Wprowadzone dane są niepoprawne!</li>
                </ul>
            </div>

            <div class="container">
                <div class="btns-panel">
                    <input class="btn" type="submit" name="create" value="create" th:name="${akcja}" th:value="${opis}" th:if="${akcja != 'delete'}"/>
                    <input class="btn" type="submit" name="cancel" value="Anuluj" />
                    <input class="btn" type="submit" name="delete" value="Usuń"
                        th:if="*{zadanieId} and akcja != 'delete'"
                        th:attr="onclick=|return confirm('Czy na pewno chcesz usunąć zadanie [[*{nazwa}]]?');|"/>
                </div>

                <div th:if="*{zadanieId}">
                    <label for="zadanieId" class="lbl">Id:</label>
                    <input th:field="*{zadanieId}" class="fld" readonly />
                </div>

                <div>
                    <label for="nazwa" class="lbl">Nazwa:</label>
                    <input th:field="*{nazwa}" class="fld" th:class="${#fields.hasErrors('nazwa')}? 'err' : 'fld'" size="45" required/>
                    <span class="err" th:if="${#fields.hasErrors('nazwa')}" th:errors="*{nazwa}">Error</span>
                </div>

                <div>
                    <label for="kolejnosc" class="lbl">Kolejność:</label>
                    <input th:field="*{kolejnosc}" class="fld" th:class="${#fields.hasErrors('kolejnosc')}? 'err' : 'fld'" size="10" required/>
                    <span class="err" th:if="${#fields.hasErrors('kolejnosc')}" th:errors="*{kolejnosc}">Error</span>
                </div>

                <div>
                    <label for="opis" class="lbl">Opis:</label>
                    <textarea class="fld" rows="3" cols="47" th:field="*{opis}"></textarea>
                </div>

                <div>
                    <label for="dataczasDodania" class="lbl">Data dodania:</label>
                    <input th:field="*{dataczasDodania}" class="fld" type="datetime-local" size="23"/>
                </div>

                <div>
                    <label for="projektId" class="lbl">ID projektu:</label>
                    <input th:field="*{projektId}" class="fld" size="10"/>
                </div>
            </div>
        </form>
    </div>
</body>
</html>
